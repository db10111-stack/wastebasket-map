<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대전 쓰레기통 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#F2F5EF;
    --surface:#FFFFFF;
    --ink:#16231A;
    --ink-soft:#586257;
    --line:#DDE4D8;
    --recycle:#1D6F8C;   --recycle-bg:#E4F0F5;
    --food:#6B8F3E;      --food-bg:#EEF3E3;
    --general:#756F63;   --general-bg:#EFEDE7;
    --cigarette:#B98A3D; --cigarette-bg:#F5EDDC;
    --battery:#6E5A9E;   --battery-bg:#ECE8F4;
    --clothing:#B23A63;  --clothing-bg:#F5E3EA;
    --danger:#B4432F;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 6px 20px rgba(22,35,26,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    color:var(--ink);
    background:var(--bg);
    overflow:hidden;
  }
  #app{position:relative;height:100vh;height:calc(var(--app-height, 100vh));width:100%;display:flex;flex-direction:column;}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 14px;background:var(--surface);
    border-bottom:1px solid var(--line);
    z-index:20;
  }
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  header p{margin:2px 0 0;font-size:11.5px;color:var(--ink-soft);}
  .icon-row{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;
  }
  .icon-btn.active{background:var(--ink);border-color:var(--ink);}
  .icon-btn.active span{filter:invert(1);}

  #map{flex:1;width:100%;height:100%;z-index:1;}
  .map-wrap{position:relative;flex:1;width:100%;min-height:0;}

  .fab-stack{position:absolute;left:16px;bottom:24px;z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
  .fab-locate{
    background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:999px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);cursor:pointer;font-size:16px;
  }
  .fab-locate.locating{opacity:0.55;}
  .fab{
    background:var(--recycle);color:#fff;border:none;
    border-radius:999px;padding:14px 20px;
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;
    box-shadow:var(--shadow);cursor:pointer;
  }
  .fab:active{transform:scale(0.97);}

  .search-bar{
    position:absolute;top:12px;left:12px;right:12px;z-index:16;
    display:flex;gap:8px;background:var(--surface);border-radius:999px;
    padding:4px 4px 4px 16px;box-shadow:var(--shadow);align-items:center;
  }
  .search-bar input{
    flex:1;border:none;background:transparent;font-size:13.5px;padding:9px 0;
    font-family:inherit;color:var(--ink);
  }
  .search-bar input:focus{outline:none;}
  .search-bar button{
    width:36px;height:36px;border-radius:50%;border:none;background:var(--ink);
    color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;
  }

  .mode-badge{
    position:absolute;top:68px;left:50%;transform:translateX(-50%);
    background:var(--recycle-bg);border:1px solid var(--recycle-bg);color:var(--recycle);
    padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;
    box-shadow:var(--shadow);z-index:15;
    display:none;align-items:center;gap:6px;
  }
  .mode-dot{width:7px;height:7px;border-radius:50%;background:var(--recycle);}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(22,35,26,0.35);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:480px;
    border-radius:20px 20px 0 0;padding:20px 20px 26px;
    max-height:85vh;overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px;}
  .sheet h2{margin:0 0 4px;font-size:18px;}
  .sheet .sub{margin:0 0 18px;font-size:13px;color:var(--ink-soft);line-height:1.5;}

  label.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:16px 0 8px;}
  input[type=text],input[type=password]{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:var(--bg);
  }
  input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--recycle);outline-offset:1px;}

  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .type-chip{
    border:1.5px solid var(--line);border-radius:12px;padding:16px 8px;
    text-align:center;cursor:pointer;background:var(--surface);
    font-size:14px;font-weight:700;color:var(--ink-soft);
    transition:border-color .15s, background .15s;
  }
  .type-chip .dot{width:18px;height:18px;border-radius:50%;margin:0 auto 8px;}
  .type-chip[data-type="general"] .dot{background:var(--general);}
  .type-chip[data-type="recycle"] .dot{background:var(--recycle);}
  .type-chip[data-type="food"] .dot{background:var(--food);}
  .type-chip[data-type="cigarette"] .dot{background:var(--cigarette);}
  .type-chip[data-type="battery"] .dot{background:var(--battery);}
  .type-chip[data-type="clothing"] .dot{background:var(--clothing);}
  .type-chip.selected[data-type="general"]{border-color:var(--general);background:var(--general-bg);color:var(--ink);}
  .type-chip.selected[data-type="recycle"]{border-color:var(--recycle);background:var(--recycle-bg);color:var(--ink);}
  .type-chip.selected[data-type="food"]{border-color:var(--food);background:var(--food-bg);color:var(--ink);}
  .type-chip.selected[data-type="cigarette"]{border-color:var(--cigarette);background:var(--cigarette-bg);color:var(--ink);}
  .type-chip.selected[data-type="battery"]{border-color:var(--battery);background:var(--battery-bg);color:var(--ink);}
  .type-chip.selected[data-type="clothing"]{border-color:var(--clothing);background:var(--clothing-bg);color:var(--ink);}

  .btn-row{display:flex;gap:10px;margin-top:22px;}
  button.primary, button.secondary{
    flex:1;padding:13px;border-radius:var(--radius-sm);border:none;
    font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  button.primary{background:var(--ink);color:#fff;}
  button.primary.inactive{background:#B7BDB3;}
  button.secondary{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}
  .field-error{color:var(--danger);font-size:12.5px;margin-top:8px;display:none;}

  .photo-drop-mini{
    border:1.5px dashed var(--line);border-radius:var(--radius-sm);
    padding:14px;text-align:center;cursor:pointer;background:var(--bg);
    font-size:12.5px;color:var(--ink-soft);
  }
  #binPreviewWrap{position:relative;display:none;margin-bottom:2px;}
  #binPreviewImg{width:100%;border-radius:var(--radius-sm);max-height:160px;object-fit:cover;display:block;}
  #binPhotoRemove{
    position:absolute;top:8px;right:8px;background:rgba(22,35,26,0.65);color:#fff;
    border:none;border-radius:999px;width:26px;height:26px;font-size:14px;cursor:pointer;
  }

  .photo-drop{
    border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg);
  }
  .photo-drop p{margin:10px 0 0;font-size:13px;color:var(--ink-soft);}
  #previewImg{width:100%;border-radius:var(--radius);display:none;margin-bottom:14px;max-height:260px;object-fit:cover;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--ink-soft);font-size:12px;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .loading-row{display:flex;align-items:center;gap:10px;padding:18px 4px;color:var(--ink-soft);font-size:13.5px;}
  .spinner{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--recycle);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .result-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;}
  .result-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:10px;}
  .result-badge.general{background:var(--general-bg);color:var(--general);}
  .result-badge.recycle{background:var(--recycle-bg);color:var(--recycle);}
  .result-badge.food{background:var(--food-bg);color:var(--food);}
  .result-badge.cigarette{background:var(--cigarette-bg);color:var(--cigarette);}
  .result-badge.battery{background:var(--battery-bg);color:var(--battery);}
  .result-badge.clothing{background:var(--clothing-bg);color:var(--clothing);}
  .result-item{font-size:15px;font-weight:700;margin:0 0 10px;}
  .result-steps{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--ink);}
  .result-tip{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .error-text{color:var(--danger);font-size:13.5px;padding:14px 4px;}

  .popup-title{font-weight:700;font-size:13.5px;margin-bottom:2px;}
  .popup-note{font-size:12px;color:#586257;margin-bottom:8px;}
  .popup-photo-label{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .popup-actions{display:flex;gap:10px;}
  .popup-del{font-size:12px;color:var(--danger);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;}

  .legend-row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;}
  .legend-row .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}

  input[type=file]{display:none;}

  #appToast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;
    font-size:13px;font-weight:600;max-width:88%;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
    z-index:500;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  #appToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app">
  <header>
    <div>
      <h1>대전 쓰레기통 지도</h1>
      <p id="headerSub">대전광역시 전체</p>
    </div>
    <div class="icon-row">
      <button class="icon-btn" id="legendBtn" title="범례"><span>ℹ️</span></button>
      <button class="icon-btn" id="adminBtn" title="관리자 모드"><span id="adminIcon">🔒</span></button>
    </div>
  </header>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="동네, 주소, 건물 이름 검색">
      <button id="searchBtn" title="검색">🔍</button>
    </div>
    <div class="mode-badge" id="modeBadge"><span class="mode-dot"></span><span id="modeBadgeText"></span></div>

    <div class="fab-stack">
      <button class="fab-locate" id="locateBtn" title="내 위치로 돌아가기">📍</button>
      <button class="fab" id="openPhotoBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        분리수거 확인
      </button>
    </div>
  </div>
</div>
<div id="appToast"></div>

<!-- Add bin sheet (admin only) -->
<div class="sheet-overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="addTitle">쓰레기통 등록</h2>
    <p class="sub" id="addSub">선택한 위치에 쓰레기통 정보를 바로 등록합니다.</p>

    <label class="field-label">종류</label>
    <div class="type-grid">
      <div class="type-chip" data-type="general"><div class="dot"></div>🗑️ 일반쓰레기</div>
      <div class="type-chip" data-type="recycle"><div class="dot"></div>♻️ 재활용</div>
    </div>

    <label class="field-label">주소 (선택)</label>
    <input type="text" id="binAddress" placeholder="예: 대전 서구 도안동 123-4">

    <label class="field-label">위치 설명 (선택)</label>
    <input type="text" id="binNote" placeholder="예: 공원 입구 옆, 편의점 앞">

    <label class="field-label">사진 (선택)</label>
    <div id="binPreviewWrap">
      <img id="binPreviewImg" alt="쓰레기통 사진">
      <button type="button" id="binPhotoRemove">✕</button>
    </div>
    <div class="photo-drop-mini" id="binPhotoDrop">📷 쓰레기통 사진 추가</div>
    <input type="file" id="binFileInput" accept="image/*" capture="environment">
    <p class="field-error" id="addFieldError">종류를 선택해주세요.</p>

    <div class="btn-row">
      <button class="secondary" id="cancelAddBtn">취소</button>
      <button class="primary inactive" id="saveBinBtn">등록하기</button>
    </div>
  </div>
</div>

<!-- Admin PIN sheet (dynamic content) -->
<div class="sheet-overlay" id="adminOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="adminBody"></div>
  </div>
</div>

<!-- Legend sheet -->
<div class="sheet-overlay" id="legendOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>범례</h2>
    <p class="sub">쓰레기통 종류예요.</p>
    <div class="legend-row"><div class="dot" style="background:var(--general)"></div>🗑️ 일반쓰레기</div>
    <div class="legend-row"><div class="dot" style="background:var(--recycle)"></div>♻️ 재활용</div>
    <div class="btn-row"><button class="secondary" id="closeLegendBtn" style="flex:1;">닫기</button></div>
  </div>
</div>

<!-- Confirm sheet (replaces native confirm(), which is unreliable in this sandbox) -->
<div class="sheet-overlay" id="confirmOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>확인해주세요</h2>
    <p class="sub" id="confirmMessage"></p>
    <div class="btn-row">
      <button class="secondary" id="confirmNoBtn" style="flex:1;">취소</button>
      <button class="primary" id="confirmYesBtn" style="flex:1;background:var(--danger);">삭제</button>
    </div>
  </div>
</div>

<!-- Photo analysis sheet -->
<div class="sheet-overlay" id="photoOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>AI 분리수거 도우미</h2>
    <p class="sub">사진을 찍거나 제품 이름만 입력해도 분리배출 방법을 알려드려요.</p>

    <img id="previewImg" alt="선택한 사진 미리보기">

    <div class="photo-drop" id="photoDrop">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#586257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <p>탭해서 사진 촬영 또는 업로드</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <div class="or-divider">또는</div>
    <label class="field-label">제품 이름으로 확인</label>
    <input type="text" id="itemNameInput" placeholder="예: 요구르트병, 건전지, 우산">

    <div id="analysisArea"></div>

    <div class="btn-row" id="photoBtnRow">
      <button class="secondary" id="retakeBtn" style="display:none;">사진 제거</button>
      <button class="primary" id="analyzeBtn" disabled>분석하기</button>
    </div>
    <div class="btn-row">
      <button class="secondary" id="closePhotoBtn" style="flex:1;">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  var TYPE_META = {
    general:{ label:"일반쓰레기", color:"#756F63", icon:"🗑️"},
    recycle:{ label:"재활용",     color:"#1D6F8C", icon:"♻️"}
  };
  var DAEJEON_CENTER = [36.3504, 127.3845]; // 대전광역시 대략 중심

  var bins = [];
  var ownerPinHash = null;
  var adminMode = false;
  var deleteMode = false;

  var map, tempMarker = null, pendingLatLng = null, selectedType = null, editingBinId = null;
  var binLayer;
  var binPhotoDataUrl = null;
  var userLocationMarker = null, userAccuracyCircle = null, watchId = null;

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  async function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  function fileToCompressedDataUrl(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  var toastTimer = null;
  function showToast(msg, duration){
    var toast = el('appToast');
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, duration || 3200);
  }

  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  async function storageSetSafe(key, value, shared){
    for(var attempt=0; attempt<2; attempt++){
      try{
        var r = await window.storage.set(key, value, shared);
        if(r) return true;
        throw new Error('empty response');
      }catch(e){
        console.error('storage set failed ('+key+'), attempt '+(attempt+1), e);
        if(attempt === 0){ await wait(700); continue; }
        var reason = (e && e.message) ? e.message : '알 수 없는 오류';
        showToast('저장에 실패했어요 (' + reason + '). 이 사이트를 Claude 안에서 열고 있는지 확인해주세요.', 5000);
        return false;
      }
    }
    return false;
  }
  async function storageGetSafe(key, shared){
    try{
      var r = await window.storage.get(key, shared);
      return r;
    }catch(e){
      return null;
    }
  }

  // ---- icons ----
  function solidIcon(type, size){
    size = size || 26;
    var meta = TYPE_META[type] || TYPE_META.general;
    var fontSize = Math.max(8, Math.round(size * 0.46));
    return L.divIcon({
      className:"",
      html:
        '<div style="width:'+size+'px;height:'+size+'px;border-radius:50% 50% 50% 0;background:'+meta.color+';transform:rotate(-45deg);border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;">'+
          '<span style="transform:rotate(45deg);font-size:'+fontSize+'px;line-height:1;">'+meta.icon+'</span>'+
        '</div>',
      iconSize:[size,size], iconAnchor:[size/2,size]
    });
  }
  function iconSizeForZoom(zoom){
    if(zoom <= 12) return 12;
    if(zoom <= 13) return 15;
    if(zoom <= 14) return 18;
    if(zoom <= 15) return 21;

  function initMap(){
    map = L.map('map', {zoomControl:true}).setView(DAEJEON_CENTER, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    binLayer = L.layerGroup().addTo(map);

    map.on('click', function(e){
      if(deleteMode) return;
      if(adminMode){ openAddSheet(e.latlng); }
    });

    var lastIconSize = null;
    map.on('zoomend', function(){
      var size = iconSizeForZoom(map.getZoom());
      if(size === lastIconSize) return;
      lastIconSize = size;
      binLayer.eachLayer(function(marker){
        marker.setIcon(solidIcon(marker.binType, size));
      });
    });

    boot();
    autoShowMyLocation();
  }

  function updateUserLocation(lat, lng, accuracy){
    var latlng = [lat, lng];
    if(!userLocationMarker){
      userLocationMarker = L.marker(latlng, {icon:userDotIcon(), zIndexOffset:1000}).addTo(map);
      userLocationMarker.bindPopup('<div class="popup-title">내 위치</div>', {closeButton:false});
    } else {
      userLocationMarker.setLatLng(latlng);
    }
    if(accuracy){
      if(!userAccuracyCircle){
        userAccuracyCircle = L.circle(latlng, {radius:accuracy, color:'#1D6F8C', weight:1, fillColor:'#1D6F8C', fillOpacity:0.1, opacity:0.25}).addTo(map);
      } else {
        userAccuracyCircle.setLatLng(latlng);
        userAccuracyCircle.setRadius(accuracy);
      }
    }
  }

  function startWatchingLocation(){
    if(watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(
      function(pos){ updateUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); },
      function(){ /* silently ignore ongoing tracking errors */ },
      {enableHighAccuracy:true, maximumAge:10000}
    );
  }

  function autoShowMyLocation(){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        updateUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        startWatchingLocation();
      },
      function(){ /* permission not granted yet or unavailable - stay silent */ },

  }

  function runSearch(){
    var q = el('searchInput').value.trim();
    if(!q) return;
    var normalized = q.replace(/\s+/g, '');

    // 1) exact match
    if(DONG_GAZETTEER[normalized]){
      map.flyTo(DONG_GAZETTEER[normalized], 16);
      return;
    }
    // 2) substring match (either direction)
    var matchKey = null;
    for(var key in DONG_GAZETTEER){
      if(key.indexOf(normalized) !== -1 || normalized.indexOf(key) !== -1){
        matchKey = key; break;
      }
    }
    if(matchKey){
      map.flyTo(DONG_GAZETTEER[matchKey], 16);
      return;
    }
    // 3) search our own bin data (address/note text)
    var lowerQ = normalized;
    var binMatch = bins.find(function(b){
      var hay = ((b.address||'') + (b.note||'')).replace(/\s+/g, '');
      return hay.indexOf(lowerQ) !== -1;
    });
    if(binMatch){
      map.flyTo([binMatch.lat, binMatch.lng], 17);
      return;
    }

    showToast('찾을 수 없어요. "도안동", "둔산동"처럼 동 이름으로 검색해보세요.');
  }
  el('searchBtn').addEventListener('click', runSearch);
  el('searchInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); runSearch(); }
  });

    btn.classList.add('locating');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        btn.classList.remove('locating');
        updateUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        map.flyTo([pos.coords.latitude, pos.coords.longitude], 17);

  async function boot(){
    var r = await storageGetSafe('ownerAuth', true);
    ownerPinHash = r && r.value ? JSON.parse(r.value).pinHash : null;

    var p = await storageGetSafe('isAdmin', false);
    if(p && p.value === 'true' && ownerPinHash){ adminMode = true; }

    await loadBins();
    updateModeUI();
  }

  async function addDeletedSeedKey(key){
    var r = await storageGetSafe('deletedSeedKeys', true);
    var list = [];
    try{ list = r && r.value ? JSON.parse(r.value) : []; }catch(e){ list = []; }
    if(list.indexOf(key) === -1){
      list.push(key);
      await storageSetSafe('deletedSeedKeys', JSON.stringify(list), true);
    }
  }

  async function loadBins(){
    var result = await storageGetSafe('bins', true);
    try{
      bins = result && result.value ? JSON.parse(result.value) : [];
    }catch(e){ bins = []; }

    if(SEED_BINS.length > 0){
      var deletedR = await storageGetSafe('deletedSeedKeys', true);
      var deletedKeys = {};
      try{
        (deletedR && deletedR.value ? JSON.parse(deletedR.value) : []).forEach(function(k){ deletedKeys[k] = true; });
      }catch(e){}

      var existingKeys = {};
      bins.forEach(function(b){
        existingKeys[b.lat.toFixed(6)+','+b.lng.toFixed(6)+','+b.type] = true;
      });

      var added = 0;
      SEED_BINS.forEach(function(s){
        var key = s.lat.toFixed(6)+','+s.lng.toFixed(6)+','+s.type;
        if(existingKeys[key] || deletedKeys[key]) return;
        existingKeys[key] = true;
        added++;
        bins.push({
          id:'bin_seed_'+Math.random().toString(36).slice(2,9),
          lat:s.lat, lng:s.lng, type:s.type,
          note:s.note || '', address:s.name || '', photo:null,
          createdAt:Date.now()
        });
      });

      if(added > 0){
        await storageSetSafe('bins', JSON.stringify(bins), true);
      }
    }

    renderBinMarkers();
  }
  async function saveBins(){
    return await storageSetSafe('bins', JSON.stringify(bins), true);
  }

  // ---- render markers ----
  function renderBinMarkers(){
    binLayer.clearLayers();
    var size = iconSizeForZoom(map.getZoom());
    bins.forEach(function(bin){
      var meta = TYPE_META[bin.type] || TYPE_META.general;
      var marker = L.marker([bin.lat, bin.lng], {icon:solidIcon(bin.type, size)}).addTo(binLayer);
      marker.binType = bin.type;
      var photoHtml = bin.photo ? '<div class="popup-photo-label">📷 등록된 사진</div><img src="'+bin.photo+'" style="width:100%;max-width:220px;border-radius:8px;margin-bottom:8px;display:block;">' : '';
      var addressHtml = bin.address ? '<div class="popup-note">📍 '+escapeHtml(bin.address)+'</div>' : '';
      var noteHtml = bin.note ? '<div class="popup-note">'+escapeHtml(bin.note)+'</div>' : '';
      var actionsHtml = adminMode ? '<div class="popup-actions"><button class="popup-del" style="color:var(--recycle);" onclick="window.__editBin(\''+bin.id+'\')">종류/정보 수정</button><button class="popup-del" onclick="window.__deleteBin(\''+bin.id+'\')">삭제하기</button></div>' : '';
      var popupHtml =
        '<div class="popup-title">'+meta.label+'</div>'+
        photoHtml+
        addressHtml+
        noteHtml+
        actionsHtml;
      marker.bindPopup(popupHtml, {closeButton:false});
      marker.on('click', function(){
        if(deleteMode){
          marker.closePopup();
          window.__deleteBin(bin.id);
        }
      });
    });
  }

  window.__editBin = function(id){
    var bin = bins.find(function(b){ return b.id === id; });
    if(!bin) return;
    map.closePopup();

    pendingLatLng = null;
    editingBinId = id;
    selectedType = bin.type;

    el('addTitle').textContent = '쓰레기통 정보 수정';
    el('addSub').textContent = '종류나 설명, 사진을 바꿀 수 있어요. 위치는 그대로 유지돼요.';
    el('saveBinBtn').textContent = '수정하기';

    document.querySelectorAll('.type-chip').forEach(function(c){
      c.classList.toggle('selected', c.getAttribute('data-type') === bin.type);
    });
    el('binNote').value = bin.note || '';
    el('binAddress').value = bin.address || '';
    el('binFileInput').value = '';
    binPhotoDataUrl = bin.photo || null;
    if(bin.photo){
      el('binPreviewImg').src = bin.photo;
      el('binPreviewWrap').style.display = 'block';
      el('binPhotoDrop').style.display = 'none';
    } else {
      el('binPreviewWrap').style.display = 'none';
      el('binPhotoDrop').style.display = 'block';
    }
    el('addFieldError').style.display = 'none';
    el('saveBinBtn').classList.remove('inactive');

    if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }

    el('addOverlay').classList.add('open');
  };

  el('saveBinBtn').addEventListener('click', async function(){
    if(!editingBinId && !pendingLatLng) return;
    if(!selectedType){
      el('addFieldError').style.display = 'block';
      return;
    }

    var note = el('binNote').value.trim().slice(0,80);
    var address = el('binAddress').value.trim().slice(0,120);
    var photo = binPhotoDataUrl;
    el('saveBinBtn').classList.add('inactive');

    if(editingBinId){
      var idx = bins.findIndex(function(b){ return b.id === editingBinId; });
      if(idx === -1){ closeAddSheet(); return; }
      var original = bins[idx];
      var updated = Object.assign({}, original, {type:selectedType, note:note, address:address, photo:photo});
      bins[idx] = updated;
      var okEdit = await saveBins();
      if(!okEdit){ bins[idx] = original; el('saveBinBtn').classList.remove('inactive'); }
      else { renderBinMarkers(); closeAddSheet(); }
    } else {
      var newBin = {
        id:'bin_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        lat:pendingLatLng.lat, lng:pendingLatLng.lng,
        type:selectedType, note:note, address:address, photo:photo, createdAt:Date.now()
      };
      bins.push(newBin);
      var ok = await saveBins();
      if(!ok){ bins.pop(); el('saveBinBtn').classList.remove('inactive'); }
      else { renderBinMarkers(); closeAddSheet(); }
    }
  });

  window.__deleteBin = async function(id){
    showConfirm('이 쓰레기통 정보를 삭제할까요?', async function(){
      var idx = bins.findIndex(function(b){ return b.id === id; });
      if(idx === -1) return;
      var removed = bins.splice(idx,1)[0];
      var ok = await saveBins();
      if(ok){
        renderBinMarkers(); map.closePopup();
        if(removed.id && removed.id.indexOf('bin_seed_') === 0){
          await addDeletedSeedKey(removed.lat.toFixed(6)+','+removed.lng.toFixed(6)+','+removed.type);
        }
      } else {
        bins.push(removed);
      }
    });
  };

  function resetPhotoSheet(){
    selectedFile = null; selectedBase64 = null;
    el('previewImg').style.display = 'none';
    el('photoDrop').style.display = 'block';
    el('itemNameInput').value = '';
    el('analysisArea').innerHTML = '';
    el('fileInput').value = '';
    updateAnalyzeAvailability();
  }
  function updateAnalyzeAvailability(){
    var hasPhoto = !!selectedBase64;
    var hasName = el('itemNameInput').value.trim().length > 0;
    el('retakeBtn').style.display = hasPhoto ? 'inline-block' : 'none';
    el('analyzeBtn').disabled = !(hasPhoto || hasName);
  }
  el('photoDrop').addEventListener('click', function(){ el('fileInput').click(); });
  el('retakeBtn').addEventListener('click', function(){
    selectedFile = null; selectedBase64 = null;
    el('previewImg').style.display = 'none';
    el('photoDrop').style.display = 'block';
    el('fileInput').value = '';
    updateAnalyzeAvailability();
  });
  el('itemNameInput').addEventListener('input', updateAnalyzeAvailability);

  el('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    selectedFile = file;
    var reader = new FileReader();
    reader.onload = function(evt){
      var dataUrl = evt.target.result;
      selectedBase64 = dataUrl.split(',')[1];
      el('previewImg').src = dataUrl;
      el('previewImg').style.display = 'block';
      el('photoDrop').style.display = 'none';
      el('analysisArea').innerHTML = '';
      updateAnalyzeAvailability();
    };
    reader.readAsDataURL(file);
  });

  el('analyzeBtn').addEventListener('click', async function(){
    var itemName = el('itemNameInput').value.trim();
    if(!selectedBase64 && !itemName) return;
    var area = el('analysisArea');
    area.innerHTML = '<div class="loading-row"><div class="spinner"></div>분리배출 방법을 확인하고 있어요...</div>';
    el('analyzeBtn').disabled = true;

    try{
      var systemPrompt = "당신은 한국의 분리배출 규정에 정통한 도우미입니다. 사용자가 올린 사진이나 알려준 물건 이름을 보고 " +
        "어떻게 분리배출해야 하는지 안내합니다. 반드시 순수 JSON 객체 하나만 응답하세요. 코드블록이나 설명 문구를 " +
        "절대 포함하지 마세요. JSON 형식: " +
        '{"item":"물건 이름(한국어, 간결하게)","category":"general 또는 recycle 중 하나 (지도에 있는 쓰레기통 종류 기준)",' +
        '"category_label":"실제 배출 방법을 한국어로 구체적으로 표시 (예: 재활용-플라스틱, 재활용-종이, 일반쓰레기, 음식물쓰레기는 별도 배출, 담배꽁초는 전용 수거함 등 실제 분리배출 기준을 반영)",' +
        '"steps":["배출 전 처리 방법을 순서대로 나열한 문장들"],' +
        '"tip":"헷갈리기 쉬운 부분이나 주의사항 한두 문장"}' +
        " steps는 2~4개의 구체적이고 실행 가능한 문장으로 작성하세요. 사진이 없고 물건 이름만 주어진 경우, 이름만으로 합리적으로 추정해서 안내하세요.";

      var content = [];
      var textMsg;
      if(selectedBase64){
        var mediaType = selectedFile.type || 'image/jpeg';
        content.push({ type:"image", source:{ type:"base64", media_type: mediaType, data: selectedBase64 } });
        textMsg = itemName
          ? "사진 속 물건 이름은 '"+itemName+"'입니다. 이 물건은 어떻게 분리배출해야 하나요?"
          : "이 사진 속 물건은 어떻게 분리배출해야 하나요?";
      } else {
        textMsg = "'"+itemName+"'은(는) 어떻게 분리배출해야 하나요?";
      }
      content.push({ type:"text", text: textMsg });

      var response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role:"user", content: content }]
        })
      });
      if(!response.ok) throw new Error("API 요청 실패 (" + response.status + ")");

      var data = await response.json();
      var textBlock = (data.content || []).find(function(b){ return b.type === 'text'; });
      if(!textBlock) throw new Error("응답을 읽을 수 없어요.");

      var raw = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      var parsed = JSON.parse(raw);
      renderResult(parsed);
    }catch(err){
      area.innerHTML = '<div class="error-text">분석에 실패했어요. 다시 시도해주세요.</div>';
    }finally{
      updateAnalyzeAvailability();
    }
  });

  function renderResult(parsed){
    var meta = TYPE_META[parsed.category] || TYPE_META.general;
    var stepsHtml = (parsed.steps || []).map(function(s){ return '<li>'+escapeHtml(s)+'</li>'; }).join('');
    var tipHtml = parsed.tip ? '<div class="result-tip">💡 '+escapeHtml(parsed.tip)+'</div>' : '';
    el('analysisArea').innerHTML =
      '<div class="result-card">' +
        '<span class="result-badge ' + parsed.category + '">' + escapeHtml(parsed.category_label || meta.label) + '</span>' +
        '<p class="result-item">' + escapeHtml(parsed.item || '') + '</p>' +
        '<ol class="result-steps">' + stepsHtml + '</ol>' +
        tipHtml +
      '</div>';
  }

  function setAppHeight(){
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    if(typeof map !== 'undefined' && map){ map.invalidateSize(); }
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', setAppHeight);
  setAppHeight();

  initMap();
})();
</script>
</body>
</html>
